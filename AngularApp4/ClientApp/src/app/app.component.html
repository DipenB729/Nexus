<ng-container *ngIf="isAuthRoute; else appLayout">
  <main class="auth-shell">
    <router-outlet></router-outlet>
  </main>
</ng-container>

<ng-template #appLayout>
  <ng-container *ngIf="isDashboardRoute; else publicLayout">
    <div
      class="dashboard-wrapper"
      [class.admin-mode]="currentRole === 'Admin'"
      [class.doctor-mode]="currentRole === 'Doctor'"
      [class.user-mode]="currentRole === 'User'">
      <app-navbar
        class="sidebar-nav"
        [class.collapsed]="!isSidebarExpanded"
        [isExpanded]="isSidebarExpanded"
        [role]="currentRole || 'Admin'"
        [displayName]="userDisplayName"
        (toggleEvent)="toggleSidebar()"
        (logoutEvent)="logout()">
      </app-navbar>

      <main class="main-content">
        <header class="top-navbar">
          <div class="header-left">
            <button mat-icon-button (click)="toggleSidebar()" class="menu-toggle">
              <mat-icon>{{ isSidebarExpanded ? 'menu_open' : 'menu' }}</mat-icon>
            </button>
            <div>
              <span class="workspace-chip">{{ workspaceLabel }}</span>
              <h2 class="page-title">{{ pageTitle }}</h2>
            </div>
          </div>

          <div class="header-right">
            <button
              mat-icon-button
              class="nav-icon-btn"
              [matMenuTriggerFor]="notificationsMenu"
              (click)="loadNotifications()">
              <mat-icon [matBadge]="unreadNotificationsCount" [matBadgeHidden]="unreadNotificationsCount === 0" matBadgeColor="warn">notifications</mat-icon>
            </button>

            <mat-menu #notificationsMenu="matMenu" class="notifications-menu">
              <div class="notifications-panel" (click)="$event.stopPropagation()">
                <div class="notifications-head">
                  <div class="notifications-heading">
                    <strong>Notifications</strong>
                  </div>
                  <div class="notifications-actions">
                    <button
                      mat-button
                      type="button"
                      [routerLink]="[notificationCenterRoute]">
                      View all
                    </button>
                  </div>
                </div>

                <div class="notification-scroll" *ngIf="notifications.length > 0; else noNotificationItems">
                  <button
                    mat-menu-item
                    class="notification-item"
                    *ngFor="let notification of notifications"
                    [class.unread]="!notification.isRead"
                    (click)="markNotificationAsRead(notification)">
                    <div class="notification-copy">
                      <span class="notification-title">{{ notification.title }}</span>
                      <span class="notification-message">{{ notification.message }}</span>
                      <span class="notification-time">{{ notificationTimeLabel(notification) }}</span>
                    </div>
                  </button>
                </div>

                <ng-template #noNotificationItems>
                  <div class="notification-empty">
                    <strong>No notifications yet</strong>
                    <span>New booking alerts, approval updates, and reminders will appear here.</span>
                  </div>
                </ng-template>
              </div>
            </mat-menu>

            <div class="vertical-divider"></div>

            <div class="profile-section" [matMenuTriggerFor]="profileMenu">
              <div class="user-info">
                <span class="user-name">{{ userDisplayName }}</span>
                <span class="user-status">{{ sessionRoleLabel }}</span>
              </div>
              <div class="avatar-wrapper">{{ userInitial }}</div>
              <mat-icon class="expand-icon">expand_more</mat-icon>
            </div>

            <mat-menu #profileMenu="matMenu">
              <button mat-menu-item [routerLink]="[primaryMenuRoute]">
                <mat-icon>dashboard</mat-icon>
                <span>Dashboard</span>
              </button>
              <button mat-menu-item [routerLink]="[secondaryMenuRoute]">
                <mat-icon>{{ currentRole === 'Admin' ? 'settings' : 'medical_services' }}</mat-icon>
                <span>{{ secondaryMenuLabel }}</span>
              </button>
              <mat-divider></mat-divider>
              <button mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Logout</span>
              </button>
            </mat-menu>
          </div>
        </header>

        <div class="page-body">
          <router-outlet></router-outlet>
        </div>
      </main>

      <app-floating-chat *ngIf="showFloatingChat"></app-floating-chat>
    </div>
  </ng-container>

  <ng-template #publicLayout>
    <main class="public-shell">
      <router-outlet></router-outlet>
    </main>
  </ng-template>
</ng-template>
