<aside
  class="sidebar"
  [class.collapsed]="!isExpanded"
  [class.superadmin-theme]="role === 'SuperAdmin'"
  [class.admin-theme]="role === 'Admin'"
  [class.doctor-theme]="role === 'Doctor'"
  [class.user-theme]="role === 'User'">
  <div class="sidebar-header">
    <div class="logo-box">
      <div class="logo-mark">{{ role === 'SuperAdmin' ? 'S' : role === 'Admin' ? 'A' : role === 'Doctor' ? 'D' : 'P' }}</div>
      <div class="brand-copy" *ngIf="isExpanded">
        <strong>{{ brandText }}</strong>
        <span>{{ roleSubtitle }}</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list" *ngFor="let section of navigationSections">
      <li class="nav-label" *ngIf="isExpanded && !section.collapsible">{{ section.label }}</li>
      <li class="nav-group" *ngIf="section.collapsible">
        <button type="button" class="group-toggle" [class.open]="isSectionExpanded(section)" (click)="toggleSection(section)">
          <span>{{ section.label }}</span>
          <mat-icon *ngIf="isExpanded">{{ isSectionExpanded(section) ? 'expand_less' : 'expand_more' }}</mat-icon>
        </button>
      </li>
      <li class="nav-item" *ngFor="let item of section.items" [class.group-child]="section.collapsible" [class.hidden]="section.collapsible && !isSectionExpanded(section)">
        <a
          [routerLink]="[item.route]"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="link-text" *ngIf="isExpanded">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="logout-link" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span class="link-text" *ngIf="isExpanded">Logout</span>
    </button>
  </div>
</aside>
