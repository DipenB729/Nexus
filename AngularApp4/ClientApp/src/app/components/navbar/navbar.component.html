<aside class="sidebar" [class.collapsed]="!isExpanded" [class.user-theme]="role === 'User'">
  <div class="sidebar-header">
    <div class="logo-box">
      <div class="logo-mark">{{ role === 'Admin' ? 'A' : 'U' }}</div>
      <div class="brand-copy" *ngIf="isExpanded">
        <strong>{{ brandText }}</strong>
        <span>{{ roleSubtitle }}</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list" *ngFor="let section of navigationSections">
      <li class="nav-label" *ngIf="isExpanded">{{ section.label }}</li>
      <li class="nav-item" *ngFor="let item of section.items">
        <a
          [routerLink]="[item.route]"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="link-text" *ngIf="isExpanded">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="logout-link" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span class="link-text" *ngIf="isExpanded">Logout</span>
    </button>
  </div>
</aside>
